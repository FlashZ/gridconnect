name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests host-relay.py
      - run: ruff format --check app tests host-relay.py
      - run: pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file interpolates
        run: |
          docker compose config >/dev/null
          GRIDCONNECT_NETWORK_MODE=host docker compose config | grep -q "network_mode: host"
          SOCKETEER_NETWORK_MODE=bridge GRIDCONNECT_NETWORK_MODE=host docker compose config | grep -q "network_mode: bridge"
      - run: docker build -t socketeer:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name socketeer-ci -p 8080:8080 socketeer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          echo "health endpoint never came up"; docker logs socketeer-ci; exit 1
