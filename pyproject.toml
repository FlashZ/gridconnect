[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import `app` from the repository root. Without this, a bare `pytest` fails to
# collect while `python -m pytest` happens to work, because only the latter puts
# the working directory on sys.path.
pythonpath = ["."]
